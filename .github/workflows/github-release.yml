name: Create Github Release

on:
  push:
    tags:
      - "*.*.*"
      - "*.*.*-alpha.*"

jobs:
  run_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry>=2.0,<3.0"
          poetry install --with test
      - name: Run tests
        run: poetry run python manage.py test --settings=test_settings --exclude-tag=canary --parallel --verbosity=0

  create_release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: tomtoolkit ${{ github.ref }}
        draft: true
