<div style="cursor:pointer; display:flex; align-items:center; gap:0.25rem;"
     title="Click to reveal"
     data-revealable-password
     data-password="{{ value }}">
    <input
        data-revealable-password-input
        type="password"
        readonly
        value="1234567890"
        class="form-control-plaintext p-0"
        style="flex:1; min-width:0; cursor:pointer;"
    /> <i class="fa fa-eye" style="flex-shrink:0;"></i>

    <script>
    (() => {
        const container = document.currentScript.closest('[data-revealable-password]');
        const input = container?.querySelector('[data-revealable-password-input]');
        if (!container || !input) return;

        function togglePasswordVisibility() {
            const reveal = input.type === 'password';
            input.type = reveal ? 'text' : 'password';
            input.value = reveal ? (container.dataset.password || '') : '1234567890';
        }

        container.addEventListener('click', togglePasswordVisibility);
    })();
    </script>
</div>
