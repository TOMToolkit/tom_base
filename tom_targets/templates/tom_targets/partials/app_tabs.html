{% load targets_extras %}
{% for target_tab in target_tabs_to_display %}
    <li class="nav-item">
        <a class="nav-link{% if active_tab == target_tab.slug %} active{% endif %}" id="{{target_tab.slug}}-tab" href="#{{target_tab.slug}}" role="tab" data-bs-toggle="tab">{{target_tab.label}}</a>
    </li>
{% endfor %}
